  downloads: C:/Users/aravm/Documents/htn2026/.tools/downloads
  user: C:/Users/aravm/Documents/htn2026/.tools/user
board_manager:
  additional_urls:
    - https://espressif.github.io/arduino-esp32/package_esp32_index.json
